# Render hosts the game. Supabase stores durable accounts, quizzes and history.
services:
  - type: web
    name: frostbound-classroom
    runtime: node
    region: singapore
    plan: free
    buildCommand: pnpm install --frozen-lockfile --prod
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: PNPM_VERSION
        value: 11.25.0
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: true
      - key: TRUST_PROXY
        value: 1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
